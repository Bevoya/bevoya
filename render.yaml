# Render Blueprint for bevoya-api (ADR-0002: Singapore).
# No secrets belong in this file. Variables marked `sync: false` have their
# values set in the Render dashboard (Environment tab).
services:
  - type: web
    name: bevoya-api
    runtime: docker
    region: singapore
    plan: free
    autoDeploy: false
    dockerfilePath: ./backend-java/Dockerfile
    dockerContext: ./backend-java
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_POOL_MAX
        value: "5"
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: JWT_ISSUER
        sync: false
