spring.application.name=bevoya-api

# Render sets PORT; default to 8080 locally.
server.port=${PORT:8080}
server.shutdown=graceful

# Put the request id in every log line.
logging.pattern.level=%5p [%X{requestId:-}]

# Never put exception text, stack traces or binding errors in error responses.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Database: Supabase session pooler, role bevoya_app (see docs/engineering/ENVIRONMENT.md).
# Note: an unset variable does NOT stop the start; Spring keeps the literal ${NAME} text. Check settings by behaviour.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
# Do not fail the start if the database is briefly unreachable; /health must stay up.
spring.datasource.hikari.initialization-fail-timeout=-1

# JPA: no schema changes and no connection at boot (the first Render connection can take about 10 s).
# The CI schema test is the schema check.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Auth: verify Supabase access tokens. Keys come from the JWKS URL; only ES256 is accepted.
# Issuer must match the token's iss exactly (no trailing slash).
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URL}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER}
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCE:authenticated}
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256