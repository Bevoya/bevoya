# Tests never need a real database or a real Supabase project. This file adds to (does not replace)
# src/main/resources/application.properties; values here win where both set the same key.
spring.datasource.url=jdbc:postgresql://localhost:5432/unused
spring.datasource.username=unused
spring.datasource.password=unused
bevoya.db.startup-check.enabled=false

# Auth: dummy values. The key set is fetched lazily on the first token, so nothing contacts
# these hosts. The token tests in the next step override jwk-set-uri with a local test server.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://example.invalid/auth/v1/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://example.invalid/auth/v1
spring.security.oauth2.resourceserver.jwt.audiences=authenticated
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256