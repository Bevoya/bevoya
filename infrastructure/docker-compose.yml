name: bevoya
services:
  db:
    image: pgvector/pgvector:pg17   # match your Supabase project's Postgres major version
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bevoya
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/local-init.sql:/docker-entrypoint-initdb.d/00-local-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d bevoya']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
