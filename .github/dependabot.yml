# Add the maven, uv and docker entries when backend-java and ai-python are scaffolded
# (Dependabot reports errors for ecosystems whose manifest files do not exist yet).
version: 2
updates:
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly