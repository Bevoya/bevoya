name: ci-java
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: ci-java-${{ github.ref }}
  cancel-in-progress: true
jobs:
  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      # Unit tests now; Testcontainers integration tests arrive with the database code.
      - run: ./mvnw -B verify
