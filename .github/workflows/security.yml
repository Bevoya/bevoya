name: security
on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 3 * * 1'
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # CLI instead of the Action, which needs a licence key for organisation repos.
      # Pinned tag: bump it deliberately (Dependabot cannot update an inline image).
      - run: |
          docker run --rm -v "$PWD:/repo" --entrypoint /bin/sh \
            ghcr.io/gitleaks/gitleaks:v8.21.2 \
            -c "git config --global --add safe.directory /repo && gitleaks detect --source /repo --redact --verbose"

  audit-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      # Report-only at first: a fresh Expo tree often carries advisories in transitive
      # dependencies. Remove continue-on-error once the baseline is clean.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  audit-ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-python
    steps:
      - uses: actions/checkout@v7
      # Gate: skip until the Python project exists.
      - id: scaffold
        run: |
          if [ -f pyproject.toml ] && [ -f uv.lock ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "No Python project yet; skipping."; fi
      - if: steps.scaffold.outputs.present == 'true'
        uses: astral-sh/setup-uv@v7
      - if: steps.scaffold.outputs.present == 'true'
        run: uv sync --frozen && uv run pip-audit