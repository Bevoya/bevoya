name: ci-db
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: ci-db-${{ github.ref }}
  cancel-in-progress: true
jobs:
  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGURL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - run: psql "$PGURL" -v ON_ERROR_STOP=1 -f infrastructure/db/ci-bootstrap.sql
      - name: Migrate an empty database
        run: |
          docker run --rm --network host \
            -v "$PWD/backend-java/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:11 \
            -url=jdbc:postgresql://localhost:5432/postgres -user=postgres -password=postgres migrate
      - run: psql "$PGURL" -v ON_ERROR_STOP=1 -f infrastructure/db/schema-check.sql